<!DOCTYPE html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>감성 로또 추첨기</title>
    <style>
      :root {
        font-family: "Segoe UI", Pretendard, sans-serif;
        --grad-1: #0b1220;
        --grad-2: #1e3a8a;
        --grad-3: #6d28d9;
        --accent: #ffd166;
        --accent-text: #111827;
        --flap-bg: #111827;
        --flap-fg: #f8fafc;
        --hinge: rgba(255, 255, 255, 0.28);
        --text: #f8fafc;
        --muted: rgba(248, 250, 252, 0.72);
        --card: rgba(8, 12, 24, 0.58);
        --status-draw: #fde68a;
        --status-done: #86efac;
        --panel: rgba(15, 23, 42, 0.86);
        --cell-ball: 72px;
        --cell-flap-w: 68px;
        --cell-flap-h: 100px;
      }

      html[data-theme="light"] {
        color-scheme: light;
        --text: #0f172a;
        --muted: #475569;
        --card: rgba(255, 255, 255, 0.78);
        --status-draw: #b45309;
        --status-done: #047857;
        --panel: rgba(255, 255, 255, 0.92);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        isolation: isolate;
        overflow-x: clip;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: var(--text);
        background: var(--grad-1);
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        width: min(100%, 640px);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        width: 200%;
        z-index: -1;
        background-image: linear-gradient(
          90deg,
          var(--grad-1),
          var(--grad-2),
          var(--grad-3),
          var(--grad-1)
        );
        background-size: 50% 100%;
        pointer-events: none;
        animation: drift 18s linear infinite paused;
      }

      body.glow::before {
        animation-play-state: running;
      }

      body.glow.complete::before {
        animation-play-state: paused;
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .toolbar {
        width: min(100%, 280px);
        padding: 12px;
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        text-align: left;
      }

      .mode-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }

      .mode-row button,
      .theme-fields button {
        border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
        border-radius: 999px;
        padding: 8px 10px;
        background: transparent;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      .mode-row button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-text);
        border-color: transparent;
      }

      .theme-fields {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        font-size: 0.82rem;
      }

      .theme-fields label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .theme-fields input,
      .theme-fields select {
        width: 92px;
        border: 0;
        border-radius: 8px;
        height: 28px;
      }

      .toolbar summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .card {
        width: 100%;
        padding: 36px 28px 32px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
      }

      .lede {
        margin: 0 0 22px;
        color: var(--muted);
      }

      #status {
        min-height: 1.5em;
        margin: 0 0 22px;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      body.drawing #status {
        color: var(--status-draw);
      }

      body.complete #status {
        color: var(--status-done);
      }

      #board {
        display: flex;
        justify-content: center;
        gap: 10px;
        min-height: var(--cell-flap-h);
        align-items: center;
        margin-bottom: 22px;
      }

      .cell {
        position: relative;
        width: var(--cell-ball);
        height: var(--cell-ball);
        border-radius: 50%;
        overflow: hidden;
        perspective: 520px;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.28));
        transition: width 0.5s ease, height 0.5s ease, border-radius 0.5s ease;
      }

      body.drawing .cell {
        width: var(--cell-flap-w);
        height: var(--cell-flap-h);
        border-radius: 14px;
      }

      .half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        overflow: hidden;
      }

      .half.top {
        top: 0;
        z-index: 2;
      }

      .half.bottom {
        bottom: 0;
        z-index: 1;
      }

      .face {
        position: absolute;
        left: 0;
        width: 100%;
        height: 200%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.7rem;
        font-weight: 800;
        line-height: 1;
        transition: background-color 0.5s ease, color 0.5s ease;
        background: var(--flap-bg);
        color: var(--flap-fg);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      body.complete .face[data-digit="0"] {
        background: #f4f1ea;
        color: #1c1917;
      }
      body.complete .face[data-digit="1"] {
        background: #f4c430;
        color: #1c1917;
      }
      body.complete .face[data-digit="2"] {
        background: #e85d04;
        color: #fff7ed;
      }
      body.complete .face[data-digit="3"] {
        background: #d90429;
        color: #fff1f2;
      }
      body.complete .face[data-digit="4"] {
        background: #6d28d9;
        color: #f5f3ff;
      }
      body.complete .face[data-digit="5"] {
        background: #1d4ed8;
        color: #eff6ff;
      }
      body.complete .face[data-digit="6"] {
        background: #0f766e;
        color: #f0fdfa;
      }
      body.complete .face[data-digit="7"] {
        background: #15803d;
        color: #f0fdf4;
      }
      body.complete .face[data-digit="8"] {
        background: #57534e;
        color: #fafaf9;
      }
      body.complete .face[data-digit="9"] {
        background: #111827;
        color: #fbbf24;
      }

      .half.top .face {
        top: 0;
      }

      .half.bottom .face {
        bottom: 0;
      }

      .half.top .next {
        z-index: 1;
      }

      .half.top .current {
        z-index: 2;
        transform-origin: center center;
      }

      .half.bottom .current {
        z-index: 1;
      }

      .half.bottom .next {
        z-index: 2;
        transform-origin: center center;
        transform: rotateX(90deg);
      }

      body.drawing .half.bottom .current,
      body.drawing .half.bottom .next {
        filter: brightness(0.9);
      }

      .cell.flipping .half.top .current {
        transition: transform 0.1s ease-in;
        transform: rotateX(-90deg);
      }

      .cell.flipping .half.bottom .next {
        transition: transform 0.1s ease-out 0.1s;
        transform: rotateX(0deg);
      }

      .cell::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 7%;
        right: 7%;
        height: 2px;
        margin-top: -1px;
        background: var(--hinge);
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      body.drawing .cell::after {
        opacity: 1;
      }

      #result {
        margin: 0 0 22px;
        min-height: 1.4em;
        color: var(--muted);
      }

      #drawButton {
        border: 0;
        border-radius: 999px;
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent);
        cursor: pointer;
      }

      #drawButton:hover:not(:disabled) {
        filter: brightness(1.06);
      }

      #drawButton:disabled,
      .toolbar.locked button,
      .toolbar.locked input,
      .toolbar.locked select {
        cursor: wait;
        opacity: 0.62;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        :root {
          --cell-ball: min(46px, calc((100vw - 81px) / 6));
          --cell-flap-w: min(44px, calc((100vw - 81px) / 6));
          --cell-flap-h: 68px;
        }

        .face {
          font-size: 1.85rem;
        }

        .card { padding: 28px 12px; }
        #board { gap: 5px; }
        .cell { flex-shrink: 0; }
        h1 { font-size: 1.4rem; }

      }

      @media (prefers-reduced-motion: reduce) {
        body.glow::before {
          animation: none;
        }

        .cell,
        .face,
        .cell::after,
        .cell.flipping .half.top .current,
        .cell.flipping .half.bottom .next {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
    <aside class="toolbar" id="themeToolbar">
      <div class="mode-row">
        <button type="button" id="lightMode" aria-pressed="false">라이트</button>
        <button type="button" id="darkMode" aria-pressed="true">다크</button>
      </div>
      <details>
        <summary>이 모드 꾸미기</summary>
        <div class="theme-fields">
          <label>배경 1 <input id="grad1" type="color" /></label>
          <label>배경 2 <input id="grad2" type="color" /></label>
          <label>배경 3 <input id="grad3" type="color" /></label>
          <label>강조색 <input id="accent" type="color" /></label>
          <label>
            플랩
            <select id="flapStyle">
              <option value="light">흰 바탕</option>
              <option value="dark">검은 바탕</option>
            </select>
          </label>
          <button type="button" id="resetTheme">이 모드 기본값</button>
        </div>
      </details>
    </aside>
    <main class="card">
      <h1>감성 로또 추첨기</h1>
      <p class="lede">잠깐의 설렘, 여섯 자리에 담아.<br><small>연금복권 6자리 번호 추첨</small></p>
      <p id="status" role="status">추첨 버튼을 눌러 주세요.</p>
      <div id="board" aria-hidden="true"></div>
      <div id="result" aria-live="polite" aria-atomic="true"></div>
      <button id="drawButton" type="button">추첨하기</button>
    </main>
    </div>
    <script src="로또추첨.js"></script>
  </body>
</html>
