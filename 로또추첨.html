<!DOCTYPE html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>감성 로또 추첨기</title>
    <style>
      :root {
        font-family: "Segoe UI", Pretendard, sans-serif;
        --grad-1: #0b1220;
        --grad-2: #1e3a8a;
        --grad-3: #6d28d9;
        --accent: #ffd166;
        --accent-text: #111827;
        --flap-bg: #111827;
        --flap-fg: #f8fafc;
        --hinge: rgba(255, 255, 255, 0.28);
        --text: #f8fafc;
        --muted: rgba(248, 250, 252, 0.72);
        --card: rgba(8, 12, 24, 0.58);
        --status-draw: #fde68a;
        --status-done: #86efac;
        --panel: rgba(15, 23, 42, 0.86);
        --cell-ball: 72px;
        --cell-flap-w: 68px;
        --cell-flap-h: 100px;
      }

      html[data-theme="light"] {
        color-scheme: light;
        --text: #0f172a;
        --muted: #475569;
        --card: rgba(255, 255, 255, 0.78);
        --status-draw: #b45309;
        --status-done: #047857;
        --panel: rgba(255, 255, 255, 0.92);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        isolation: isolate;
        overflow-x: clip;
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 24px 16px;
        color: var(--text);
        background: var(--grad-1);
      }

      .page {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        width: min(100%, 640px);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        width: 200%;
        z-index: -1;
        background-image: linear-gradient(
          90deg,
          var(--grad-1),
          var(--grad-2),
          var(--grad-3),
          var(--grad-1)
        );
        background-size: 50% 100%;
        pointer-events: none;
        animation: drift 18s linear infinite paused;
      }

      body.glow::before {
        animation-play-state: running;
      }
      body.fortune-active::before { animation-play-state: running; }
      body::after {
        content: "";
        position: fixed;
        inset: -50%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 28% 35%, color-mix(in srgb, var(--grad-2) 80%, transparent), transparent 45%),
          radial-gradient(ellipse at 72% 65%, color-mix(in srgb, var(--grad-3) 85%, transparent), transparent 45%),
          radial-gradient(ellipse at 50% 80%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 35%);
        opacity: 0.55;
        animation: aurora 32s linear infinite paused;
      }
      body.drawing::after, body.fortune-active::after { animation-play-state: running; }
      @keyframes aurora { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      [hidden] { display: none !important; }

      body.glow.complete::before {
        animation-play-state: paused;
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .toolbar {
        width: min(100%, 280px);
        padding: 12px;
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        text-align: left;
      }

      .mode-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }

      .mode-row button,
      .theme-fields button,
      .sound-controls button {
        border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
        border-radius: 999px;
        padding: 8px 10px;
        background: transparent;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      .mode-row button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-text);
        border-color: transparent;
      }

      .draw-options { margin: 0 auto 20px; max-width: 400px; }
      .draw-options label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.85rem; }
      #lotteryMode { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--text) 20%, transparent); background: var(--panel); color: var(--text); font: inherit; }
      #lotteryHint { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
      .sound-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; }
      .sound-controls button { font-size: 0.8rem; }
      .sound-controls label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
      #soundVolume { width: 85px; accent-color: var(--accent); }
      #volumeValue { min-width: 3em; }
      #soundHint { margin: 10px 0 0; font-size: 0.75rem; color: var(--muted); }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      body[data-lottery="645"] .face { font-size: 2.1rem; font-variant-numeric: tabular-nums; }
      body.complete .face[data-ball-color="1"] { background: #f4c430; color: #1c1917; }
      body.complete .face[data-ball-color="2"] { background: #1d4ed8; color: #eff6ff; }
      body.complete .face[data-ball-color="3"] { background: #d90429; color: #fff1f2; }
      body.complete .face[data-ball-color="4"] { background: #57534e; color: #fafaf9; }
      body.complete .face[data-ball-color="5"] { background: #15803d; color: #f0fdf4; }

      .theme-fields {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        font-size: 0.82rem;
      }

      .theme-fields label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .theme-fields input,
      .theme-fields select {
        width: 92px;
        border: 0;
        border-radius: 8px;
        height: 28px;
      }

      .toolbar summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .card {
        width: 100%;
        padding: 36px 28px 32px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
      }

      .lede {
        margin: 0 0 22px;
        color: var(--muted);
      }

      #status {
        min-height: 1.5em;
        margin: 0 0 22px;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      body.drawing #status {
        color: var(--status-draw);
      }

      body.complete #status {
        color: var(--status-done);
      }

      #board {
        display: flex;
        justify-content: center;
        gap: 10px;
        min-height: var(--cell-flap-h);
        align-items: center;
        margin-bottom: 22px;
      }

      .cell {
        position: relative;
        width: var(--cell-ball);
        height: var(--cell-ball);
        border-radius: 50%;
        overflow: hidden;
        perspective: 520px;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.28));
        transition: width 0.5s ease, height 0.5s ease, border-radius 0.5s ease;
      }

      body.drawing .cell {
        width: var(--cell-flap-w);
        height: var(--cell-flap-h);
        border-radius: 14px;
      }

      .half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        overflow: hidden;
      }

      .half.top {
        top: 0;
        z-index: 2;
      }

      .half.bottom {
        bottom: 0;
        z-index: 1;
      }

      .face {
        position: absolute;
        left: 0;
        width: 100%;
        height: 200%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.7rem;
        font-weight: 800;
        line-height: 1;
        transition: background-color 0.5s ease, color 0.5s ease;
        background: var(--flap-bg);
        color: var(--flap-fg);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      body.complete .face[data-ball-color="digit"][data-digit="0"] {
        background: #f4f1ea;
        color: #1c1917;
      }
      body.complete .face[data-ball-color="digit"][data-digit="1"] {
        background: #f4c430;
        color: #1c1917;
      }
      body.complete .face[data-ball-color="digit"][data-digit="2"] {
        background: #e85d04;
        color: #fff7ed;
      }
      body.complete .face[data-ball-color="digit"][data-digit="3"] {
        background: #d90429;
        color: #fff1f2;
      }
      body.complete .face[data-ball-color="digit"][data-digit="4"] {
        background: #6d28d9;
        color: #f5f3ff;
      }
      body.complete .face[data-ball-color="digit"][data-digit="5"] {
        background: #1d4ed8;
        color: #eff6ff;
      }
      body.complete .face[data-ball-color="digit"][data-digit="6"] {
        background: #0f766e;
        color: #f0fdfa;
      }
      body.complete .face[data-ball-color="digit"][data-digit="7"] {
        background: #15803d;
        color: #f0fdf4;
      }
      body.complete .face[data-ball-color="digit"][data-digit="8"] {
        background: #57534e;
        color: #fafaf9;
      }
      body.complete .face[data-ball-color="digit"][data-digit="9"] {
        background: #111827;
        color: #fbbf24;
      }

      .half.top .face {
        top: 0;
      }

      .half.bottom .face {
        bottom: 0;
      }

      .half.top .next {
        z-index: 1;
      }

      .half.top .current {
        z-index: 2;
        transform-origin: center center;
      }

      .half.bottom .current {
        z-index: 1;
      }

      .half.bottom .next {
        z-index: 2;
        transform-origin: center center;
        transform: rotateX(90deg);
      }

      body.drawing .half.bottom .current,
      body.drawing .half.bottom .next {
        filter: brightness(0.9);
      }

      .cell.flipping .half.top .current {
        transition: transform 0.1s ease-in;
        transform: rotateX(-90deg);
      }

      .cell.flipping .half.bottom .next {
        transition: transform 0.1s ease-out 0.1s;
        transform: rotateX(0deg);
      }

      .cell::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 7%;
        right: 7%;
        height: 2px;
        margin-top: -1px;
        background: var(--hinge);
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      body.drawing .cell::after {
        opacity: 1;
      }

      #result {
        margin: 0 0 22px;
        min-height: 1.4em;
        color: var(--muted);
      }

      #drawButton {
        border: 0;
        border-radius: 999px;
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent);
        cursor: pointer;
      }
      .primary-button {
        border: 0; border-radius: 999px; padding: 12px 24px; font: inherit;
        font-weight: 700; color: var(--accent-text); background: var(--accent); cursor: pointer;
      }
      .quiet-button { background: transparent; color: var(--muted); border: 0; padding: 10px; font: inherit; font-size: 0.85rem; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.6; }

      #drawButton:hover:not(:disabled) {
        filter: brightness(1.06);
      }

      #drawButton:disabled,
      .toolbar.locked button,
      .toolbar.locked input,
      .toolbar.locked select {
        cursor: wait;
        opacity: 0.62;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        :root {
          --cell-ball: min(46px, calc((100vw - 81px) / 6));
          --cell-flap-w: min(44px, calc((100vw - 81px) / 6));
          --cell-flap-h: 68px;
        }

        .face {
          font-size: 1.85rem;
        }
        body[data-lottery="645"] .face { font-size: 1.35rem; }

        .card { padding: 28px 12px; }
        #board { gap: 5px; }
        .cell { flex-shrink: 0; }
        h1 { font-size: 1.4rem; }

      }

      @media (prefers-reduced-motion: reduce) {
        body::before, body::after { animation: none !important; }
        body.glow::before {
          animation: none;
        }

        .cell,
        .face,
        .cell::after,
        .cell.flipping .half.top .current,
        .cell.flipping .half.bottom .next {
          transition: none;
        }
      }
    </style>
    <link rel="stylesheet" href="fortune.css">
  </head>
  <body>
    <div class="page">
    <aside class="toolbar" id="themeToolbar">
      <div class="mode-row">
        <button type="button" id="lightMode" aria-pressed="false">라이트</button>
        <button type="button" id="darkMode" aria-pressed="true">다크</button>
      </div>
      <details>
        <summary>이 모드 꾸미기</summary>
        <div class="theme-fields">
          <label>배경 1 <input id="grad1" type="color" /></label>
          <label>배경 2 <input id="grad2" type="color" /></label>
          <label>배경 3 <input id="grad3" type="color" /></label>
          <label>강조색 <input id="accent" type="color" /></label>
          <label>
            플랩
            <select id="flapStyle">
              <option value="light">흰 바탕</option>
              <option value="dark">검은 바탕</option>
            </select>
          </label>
          <button type="button" id="resetTheme">이 모드 기본값</button>
        </div>
      </details>
    </aside>
    <main class="card" id="fortunePage" aria-labelledby="fortuneHeading">
      <p class="eyebrow">A LITTLE LUCK, A LITTLE JOY</p>
      <h1 id="fortuneHeading" tabindex="-1">오늘의 운세를 뽑아볼까요?</h1>
      <p class="lede">마음이 끌리는 방식으로, 오늘의 작은 힌트를 만나보세요.</p>
      <div id="fortuneChoices" class="fortune-choices">
        <button type="button" data-fortune="tarot"><span class="choice-art" aria-hidden="true">✦</span><strong>타로 카드</strong><small>한 장에 담긴 오늘의 메시지</small></button>
        <button type="button" data-fortune="cookie"><span class="choice-art" aria-hidden="true">🥠</span><strong>포춘 쿠키</strong><small>바삭, 열어보는 작은 행운</small></button>
        <button type="button" data-fortune="water"><span class="choice-art" aria-hidden="true">≈</span><strong>물에 드러나는 운세</strong><small>물결 위로 스며드는 한마디</small></button>
        <button type="button" data-fortune="sticks"><span class="choice-art" aria-hidden="true">☷</span><strong>산통 제비 뽑기</strong><small>흔들어 꺼내는 오늘의 한 자락</small></button>
      </div>
      <section id="fortuneStage" hidden aria-labelledby="ritualHeading">
        <h2 id="ritualHeading" tabindex="-1"></h2>
        <p id="ritualHint" class="ritual-hint"></p>
        <div id="ritualArt" class="ritual-art"></div>
        <p id="fortuneStatus" role="status"></p>
        <div id="fortuneResult" class="fortune-result" hidden>
          <p class="eyebrow">TODAY'S LITTLE MESSAGE</p>
          <h3 id="fortuneTitle"></h3>
          <p id="fortuneMessage"></p>
          <p class="fortune-prompt">로또 번호 추첨을 해볼까요?</p>
          <button type="button" id="enterLottery" class="primary-button">로또 번호 추첨하러 가기 →</button>
        </div>
        <button type="button" id="chooseAgain" class="quiet-button">다른 방식으로 뽑기</button>
      </section>
      <p class="fortune-footnote">하루를 가볍게 여는 운세 놀이</p>
    </main>
    <main class="card" id="lotteryPage" hidden>
      <h1>감성 로또 추첨기</h1>
      <p class="lede">잠깐의 설렘, 여섯 숫자에 담아.</p>
      <div class="draw-options">
        <label for="lotteryMode">오늘의 추첨</label>
        <select id="lotteryMode">
          <option value="pension">연금복권 · 6자리</option>
          <option value="645">로또 · 6/45</option>
        </select>
        <p id="lotteryHint"></p>
      </div>
      <p id="status" role="status">추첨 버튼을 눌러 주세요.</p>
      <div id="board" aria-hidden="true"></div>
      <div id="result" aria-live="polite" aria-atomic="true"></div>
      <button id="drawButton" type="button">추첨하기</button>
      <div class="sound-controls" aria-label="추첨 소리 설정">
        <button type="button" id="soundToggle" aria-pressed="true">소리 켜짐</button>
        <label for="soundVolume">음량 <input id="soundVolume" aria-label="음량" type="range" min="0" max="100" value="35"><output id="volumeValue" for="soundVolume">35%</output></label>
        <button type="button" id="soundPreview">소리 들어보기</button>
      </div>
      <p id="soundHint" role="status">손뼉처럼 가볍고 부드러운 소리</p>
      <button type="button" id="backToFortune" class="quiet-button">운세 다시 뽑기</button>
    </main>
    </div>
    <script src="flap-sound.js"></script>
    <script src="fortune.js"></script>
    <script src="로또추첨.js"></script>
  </body>
</html>
